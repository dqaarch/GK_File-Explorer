<!DOCTYPE html>
<html>
<head>
<title>ABC Dump</title>
</head>
<body>
<h1>ABC Data Dump</h1>
<pre id="output">Loading...</pre>
<script>
const log = (s) => {
  document.getElementById('output').textContent += '\n' + s;
  console.log(s);
};
window.addEventListener('error', (e) => {
  log('ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
});
window.addEventListener('unhandledrejection', (e) => {
  log('UNHANDLED PROMISE: ' + e.reason);
});
log('Loading wabc_dump.js...');
</script>
<script src="wabc_dump.js"></script>
<script>
async function main() {
  try {
    log('Script loaded, checking WabcModule...');
    let Module = window.WabcModule;
    log('WabcModule type: ' + typeof Module);
    if (typeof Module === 'function') {
      log('Calling WabcModule()...');
      Module = await Module();
      log('After call, type: ' + typeof Module);
    }
    if (Module instanceof Promise) {
      log('Module is a Promise, awaiting...');
      Module = await Module;
      log('After await, type: ' + typeof Module);
    }
    log('cwrap type: ' + typeof Module.cwrap);
    log('FS type: ' + typeof Module.FS);
    log('_malloc type: ' + typeof Module._malloc);

    // Read ABC file via fetch
    log('Fetching ABC file...');
    const resp = await fetch('RunningCharacter.abc');
    log('Response status: ' + resp.status);
    const abcBytes = new Uint8Array(await resp.arrayBuffer());
    log('ABC file size: ' + abcBytes.length + ' bytes');

    // Write to wasm FS
    Module.FS.writeFile('/input.abc', abcBytes);
    log('Wrote to wasm FS');

    // Wrap functions
    const wabcOpenBuffer = Module.cwrap('wabc_open_buffer', 'number', ['string']);
    const wabcClose = Module.cwrap('wabc_close', 'number', ['number']);
    const wabcGetStartTime = Module.cwrap('wabc_get_start_time', 'number', ['number']);
    const wabcGetEndTime = Module.cwrap('wabc_get_end_time', 'number', ['number']);
    const wabcSeek = Module.cwrap('wabc_seek', 'number', ['number', 'number']);
    const wabcGetNumVertices = Module.cwrap('wabc_get_num_vertices', 'number', ['number']);
    const wabcGetNumFaces = Module.cwrap('wabc_get_num_faces', 'number', ['number']);
    const wabcGetNumExpandedVertices = Module.cwrap('wabc_get_num_expanded_vertices', 'number', ['number']);
    const wabcReadExpandedVertices = Module.cwrap('wabc_read_expanded_vertices', 'number', ['number', 'number', 'number']);

    const handle = wabcOpenBuffer('/input.abc');
    log('Handle = ' + handle);
    if (handle < 0) { log('Failed to open'); return; }

    const t0 = wabcGetStartTime(handle);
    const t1 = wabcGetEndTime(handle);
    log('Time range: [' + t0 + ', ' + t1 + ']');

    const indexedVertsBefore = wabcGetNumVertices(handle);
    const indexedFacesBefore = wabcGetNumFaces(handle);
    const expandedBefore = wabcGetNumExpandedVertices(handle);
    log('BEFORE seek: indexedVerts=' + indexedVertsBefore + ' indexedFaces=' + indexedFacesBefore + ' expanded=' + expandedBefore);

    wabcSeek(handle, t0);

    const indexedVerts = wabcGetNumVertices(handle);
    const indexedFaces = wabcGetNumFaces(handle);
    const expanded = wabcGetNumExpandedVertices(handle);
    log('AFTER seek(0): indexedVerts=' + indexedVerts + ' indexedFaces=' + indexedFaces + ' expanded=' + expanded);
    log('ratio expanded/indexed = ' + (expanded/indexedVerts).toFixed(2) + 'x');

    // Read first 6 expanded verts
    const posBuf = Module._malloc(18 * 4);
    wabcReadExpandedVertices(handle, posBuf, 18);
    log('First 6 expanded frame0 positions:');
    for (let i = 0; i < 6; i++) {
      const x = Module.getValue(posBuf + i * 12, 'float');
      const y = Module.getValue(posBuf + i * 12 + 4, 'float');
      const z = Module.getValue(posBuf + i * 12 + 8, 'float');
      log('  vert[' + i + '] X=' + x.toFixed(4) + ' Y=' + y.toFixed(4) + ' Z=' + z.toFixed(4));
    }

    // Read FULL expanded mesh for stats
    log('Reading full expanded mesh (' + (expanded*3*4/1024/1024).toFixed(1) + ' MB)...');
    const fullFloats = expanded * 3;
    const fullBuf = Module._malloc(fullFloats * 4);
    wabcReadExpandedVertices(handle, fullBuf, fullFloats);

    let sumX = 0, sumY = 0, sumZ = 0;
    let minX = Infinity, minY = Infinity, minZ = Infinity;
    let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
    const sampleStep = Math.max(1, Math.floor(expanded / 1000));
    let sampled = 0;
    for (let i = 0; i < expanded; i += sampleStep) {
      const x = Module.getValue(fullBuf + i * 12, 'float');
      const y = Module.getValue(fullBuf + i * 12 + 4, 'float');
      const z = Module.getValue(fullBuf + i * 12 + 8, 'float');
      sumX += x; sumY += y; sumZ += z;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
      sampled++;
    }
    log('Sampled ' + sampled + '/' + expanded + ' verts (step=' + sampleStep + ')');
    log('Centroid (sampled): X=' + (sumX/sampled).toFixed(2) + ' Y=' + (sumY/sampled).toFixed(2) + ' Z=' + (sumZ/sampled).toFixed(2));
    log('BBox (sampled): min=(' + minX.toFixed(2) + ',' + minY.toFixed(2) + ',' + minZ.toFixed(2) + ') max=(' + maxX.toFixed(2) + ',' + maxY.toFixed(2) + ',' + maxZ.toFixed(2) + ')');
    log('BBox size: ' + (maxX-minX).toFixed(2) + 'x' + (maxY-minY).toFixed(2) + 'x' + (maxZ-minZ).toFixed(2));

    // Compute normals, count zero-normals (sample 100 triangles)
    let zeroNormalCount = 0;
    const normalSample = Math.min(100, Math.floor(expanded / 3));
    const normalStep = Math.max(3, Math.floor(expanded / 3 / normalSample) * 3);
    for (let i = 0; i < expanded - 2; i += normalStep) {
      const v0x = Module.getValue(fullBuf + i * 12, 'float');
      const v0y = Module.getValue(fullBuf + i * 12 + 4, 'float');
      const v0z = Module.getValue(fullBuf + i * 12 + 8, 'float');
      const v1x = Module.getValue(fullBuf + (i + 1) * 12, 'float');
      const v1y = Module.getValue(fullBuf + (i + 1) * 12 + 4, 'float');
      const v1z = Module.getValue(fullBuf + (i + 1) * 12 + 8, 'float');
      const v2x = Module.getValue(fullBuf + (i + 2) * 12, 'float');
      const v2y = Module.getValue(fullBuf + (i + 2) * 12 + 4, 'float');
      const v2z = Module.getValue(fullBuf + (i + 2) * 12 + 8, 'float');
      const ex = v1x - v0x, ey = v1y - v0y, ez = v1z - v0z;
      const fx = v2x - v0x, fy = v2y - v0y, fz = v2z - v0z;
      const nx = ey * fz - ez * fy;
      const ny = ez * fx - ex * fz;
      const nz = ex * fy - ey * fx;
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      if (len < 1e-6) zeroNormalCount++;
    }
    log('Zero-normal triangles (sampled ' + normalSample + '): ' + zeroNormalCount);

    Module._free(posBuf);
    Module._free(fullBuf);
    wabcClose(handle);
    log('Done');
  } catch (e) {
    log('ERROR: ' + e.message + '\n' + e.stack);
  }
}
main();
</script>
</body>
</html>

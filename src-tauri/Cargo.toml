[package]
name = "goku-file-explorer"
version = "1.0.3"
description = "Goku File Explorer - AI-powered file explorer for designers"
authors = ["Goku"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[[bin]]
name = "goku-file-explorer"
path = "src/main.rs"

[lib]
name = "goku_file_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-drag = "2"
# tauri-plugin-prevent-default = { version = "5", features = ["platform-windows"] }
drag = "2"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
fs_extra = "1"
chrono = "0.4"
win-context-menu = { version = "0.1.4", features = ["serde"] }
sysinfo = "0.32"
dirs = "6"
base64 = "0.22"
tiny_http = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "tga", "ico"] }
half = "2"
psd = "0.3"
libloading = "0.8"
thiserror = "1"
zip = "2"
flate2 = "1"
quick-xml = "0.31"
tokio = { version = "1", features = ["rt-multi-thread", "process"] }
log = "0.4"
env_logger = "0.11"
lru = "0.12"
once_cell = "1"
memchr = "2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
rayon = "1.10"
zstd = "0.13"
winreg = "0.52"
unrar-ng = "0.7.7"

[dependencies.stl_io]
version = "0.11"

[dependencies.epub-parser]
version = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Foundation",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }
winreg = "0.52"
wincent = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
